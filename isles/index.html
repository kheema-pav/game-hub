<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-180.png"></head><body>
<title>Catan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">


<div id="app">
  <section id="home" class="screen"></section>
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <div class="players" id="players"></div>
      <span id="menuSlot"></span>
    </header>
    <main class="board-wrap">
      <svg id="board" role="group" aria-label="Catan island. Choose a highlighted corner or edge to build." xmlns="http://www.w3.org/2000/svg"><g id="static"></g><g id="dynamic"></g></svg>
      <div class="dice-box" id="dice" role="img" aria-label="Dice not rolled yet"></div>
      <div class="ticker" id="ticker"></div>
      <div class="toasts" id="toasts"></div>
      <div class="zoom">
        <button data-act="zoom-in" aria-label="Zoom in">+</button>
        <button data-act="zoom-out" aria-label="Zoom out">−</button>
        <button data-act="zoom-fit" aria-label="Fit board"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
    </main>
    <footer class="dock" id="dock"></footer>
  </section>
  <div id="modal" hidden></div>
  <div id="curtain" class="curtain" hidden></div>
</div>

<script src="../shared/hubkit.js"></script>
<script>window.HubKit=window.HubKit||{init(){},buttonHTML:()=>'',open(){},close(){},isOpen:()=>false,sfx(){},buzz(){},refresh(){},setFloating(){},settings:{}};</script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/versions.js"></script>
<script src="../shared/online.js"></script>
<script src="../shared/lobby.js"></script>
<script src="../shared/session.js"></script>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script src="game.js"></script>

</body></html>
