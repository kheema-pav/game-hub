<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Settle the Isles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app. Home = scrolling setup sheet; Game = player strip / ocean board / dock (side column on wide screens). */
:root {
  --deep: #0a2231;
  --panel: #113246;
  --panel-2: #174259;
  --line: #24546d;
  --ink: #eef4f2;
  --muted: #98b6c2;
  --gold: #ffc94a;
  --gold-ink: #3a2a00;
  --danger: #ff7a66;
  --ok: #7ad48a;
  --ocean-1: #1f6a8c;
  --ocean-2: #0c3348;
  --font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--deep); color: var(--ink); font-family: var(--font-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; }
.screen { height: 100%; }

/* ---------- Home ---------- */
#home { overflow-y: auto; background: radial-gradient(120% 70% at 50% 0%, #1b5a78 0%, var(--deep) 65%); }
.home-inner { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.hero { display: flex; align-items: center; gap: 14px; }
.hero svg { flex: none; width: 76px; height: 76px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: .2px; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--font-display); font-weight: 600; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.continue { background: linear-gradient(135deg, #2b6d3c, #1d5130); border-color: #3c8a50; flex-direction: row; align-items: center; justify-content: space-between; }
.continue b { font-family: var(--font-display); font-size: 1.1rem; }
.continue small { display: block; color: #cfe8d3; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; background: var(--panel-2); border: 2px solid transparent; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.mode[aria-pressed="true"] { border-color: var(--gold); background: #1d4e68; }
.mode b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.mode span { color: var(--muted); font-size: .85rem; line-height: 1.3; }
.mode svg { width: 100%; height: 54px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 700; }
.prow { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); }
.prow input { min-width: 0; width: 100%; background: var(--deep); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); font: inherit; font-weight: 700; }
.seg { display: inline-flex; background: var(--deep); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
.seg button { background: none; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: .82rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.icon-btn { background: none; border: 0; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); font-size: 1.2rem; line-height: 1; }
.icon-btn:disabled { opacity: .25; }
.addp { align-self: flex-start; background: none; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-weight: 700; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.opt div { min-width: 0; }
.opt small { display: block; color: var(--muted); font-size: .8rem; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--deep); border: 1px solid var(--line); border-radius: 10px; }
.stepper button { width: 34px; height: 34px; border: 0; background: none; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
.stepper button:disabled { opacity: .3; }
.stepper output { min-width: 26px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.toggle { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--deep); position: relative; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .18s; }
.toggle[aria-pressed="true"] { background: var(--gold); }
.toggle[aria-pressed="true"]::after { transform: translateX(20px); background: var(--gold-ink); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; background: var(--panel-2); color: var(--ink); }
.btn.primary { background: var(--gold); color: var(--gold-ink); box-shadow: 0 3px 0 #b8861c; }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8861c; }
.armed, .act.armed, .btn.armed { background: #ff9f43 !important; color: #2a1600 !important; box-shadow: 0 0 0 3px rgba(255,159,67,.35) !important; animation: blink 1s ease-in-out infinite; }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.btn.big { padding: 15px; font-size: 1.25rem; }
.btn.danger { background: #5a2420; color: #ffd6cf; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; }
details.rules p, details.rules li { color: var(--muted); line-height: 1.45; font-size: .9rem; }
details.rules ul { padding-left: 18px; margin: 6px 0; }

/* ---------- Game ---------- */
#game { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "board" "dock"; }
.topbar { grid-area: top; display: flex; gap: 8px; align-items: stretch; padding-block: 8px 6px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--deep); position: relative; z-index: 3; }
.players { flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.pchip { position: relative; min-width: 0; background: var(--panel); border-radius: 12px; padding: 6px 7px 5px; border: 2px solid transparent; display: flex; flex-direction: column; gap: 2px; transition: border-color .2s, background .2s; }
.pchip.turn { border-color: var(--pc); background: var(--panel-2); }
.pchip .nm { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: .8rem; white-space: nowrap; overflow: hidden; }
.pchip .nm i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 1.5px rgba(0,0,0,.4); }
.pchip .nm span { overflow: hidden; text-overflow: ellipsis; }
.pchip .vp { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1; display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
.pchip .vp small { font-family: var(--font-body); font-size: .68rem; color: var(--muted); font-weight: 700; }
.pchip .meta { display: flex; gap: 7px; font-size: .7rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.pchip .meta span { display: inline-flex; align-items: center; gap: 2px; }
.pchip .meta svg { width: 11px; height: 11px; }
.pchip .badges { position: absolute; top: -6px; right: 4px; display: flex; gap: 3px; }
.badge { background: var(--gold); color: var(--gold-ink); font-size: .58rem; font-weight: 800; border-radius: 6px; padding: 1px 4px; letter-spacing: .03em; }
.gain { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); background: var(--ok); color: #0c2b14; font-weight: 800; font-size: .72rem; border-radius: 999px; padding: 1px 7px; animation: rise 1.8s ease-out forwards; pointer-events: none; z-index: 2; }
.menu-btn { flex: none; width: 40px; border-radius: 12px; background: var(--panel); border: 0; display: grid; place-items: center; }
.menu-btn svg { width: 20px; height: 20px; }

.board-wrap { grid-area: board; position: relative; overflow: hidden; background: radial-gradient(90% 80% at 50% 45%, var(--ocean-1) 0%, var(--ocean-2) 100%); }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.dice-box { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; pointer-events: none; }
.die { width: 34px; height: 34px; background: #fbf6ea; border-radius: 8px; box-shadow: 0 3px 0 #c9bfa6, 0 4px 10px rgba(0,0,0,.3); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 5px; }
.die b { width: 6px; height: 6px; border-radius: 50%; background: #2a2118; place-self: center; }
.die.red-die b { background: #c0261b; }
.dice-box.rolling .die { animation: tumble .5s ease-out; }
.dice-sum { align-self: center; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(10,34,49,.75); color: var(--ink); font-weight: 800; font-size: 1.1rem; }
.ticker { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: 56px; bottom: 10px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
.ticker div { align-self: flex-start; max-width: 100%; background: rgba(10,34,49,.72); border-radius: 8px; padding: 3px 8px; font-size: .78rem; font-weight: 700; color: #dbe9ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker div:first-child { opacity: .6; }
.ticker i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.toasts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(92%, 380px); z-index: 25; }
.toast { background: #fbf6ea; color: #23190d; font-weight: 800; border-radius: 12px; padding: 8px 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); animation: drop .25s ease-out; font-size: .9rem; text-align: center; border-left: 6px solid var(--tc, var(--gold)); }
.toast.err { background: #ffe1db; }

.dock { grid-area: dock; background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 3; }
.prompt { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; min-height: 24px; }
.prompt i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.prompt span { min-width: 0; flex: 1; }
.prompt .thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
.hand { display: flex; gap: 6px; align-items: stretch; }
.rcard { flex: 1; min-width: 0; max-width: 64px; border-radius: 10px; overflow: hidden; background: #fbf6ea; color: #23190d; display: flex; flex-direction: column; box-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .2s; }
.rcard .art { height: 30px; display: grid; place-items: center; }
.rcard .art svg { width: 26px; height: 26px; }
.rcard .ct { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-align: center; line-height: 1.3; font-variant-numeric: tabular-nums; }
.rcard.zero { opacity: .45; }
.rcard.bump { animation: bump .5s ease-out; }
.devbtn { flex: 1.15; min-width: 0; max-width: 76px; border: 0; border-radius: 10px; background: linear-gradient(160deg, #6b3fa0, #432469); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 800; font-size: .7rem; }
.devbtn b { font-family: var(--font-display); font-size: 1.15rem; }
.devbtn.glow { box-shadow: 0 0 0 2px var(--gold); }
.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.act { border: 0; border-radius: 11px; background: var(--panel-2); padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.act .ic { height: 22px; display: grid; place-items: center; }
.act .ic svg { height: 22px; width: 30px; }
.act .lb { font-size: .72rem; font-weight: 800; }
.act .cost { display: flex; gap: 2px; height: 8px; }
.act .cost i { width: 8px; height: 8px; border-radius: 2px; }
.act:disabled { opacity: .35; cursor: default; }
.act.on { background: var(--gold); color: var(--gold-ink); }
.row2 { display: flex; gap: 6px; }
.row2 .btn { flex: 1; padding: 11px 8px; font-size: .98rem; min-width: 0; }
.row2 .btn.narrow { flex: 0 0 auto; }

/* modal sheet */
.modal-back.still, .modal-back.still .sheet { animation: none; }
.modal-back { position: fixed; inset: 0; background: rgba(4,14,20,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fade .15s; }
.sheet { width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; background: var(--panel); border-radius: 18px 18px 0 0; border: 1px solid var(--line); padding-block: 16px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@media (min-width: 700px) { .modal-back { align-items: center; } .sheet { border-radius: 18px; max-height: 84%; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.4; }
.res-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rpick { border: 2px solid transparent; border-radius: 12px; background: #fbf6ea; color: #23190d; padding: 0 0 4px; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: .72rem; }
.rpick .art { width: 100%; height: 34px; display: grid; place-items: center; }
.rpick .art svg { width: 26px; height: 26px; }
.rpick[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.rpick:disabled { opacity: .35; }
.rpick small { font-weight: 700; color: #6b5a40; font-size: .66rem; }
.cnt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cnt .stepper { flex-direction: column; gap: 0; }
.cnt .stepper button { height: 28px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; border: 0; border-radius: 10px; padding: 9px; background: var(--deep); color: var(--muted); font-weight: 800; }
.tabs button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.who { display: flex; align-items: center; gap: 10px; background: var(--deep); border-radius: 12px; padding: 8px 10px; }
.who i { flex: none; width: 14px; height: 14px; border-radius: 50%; }
.who .n { flex: 1; min-width: 0; font-weight: 800; }
.who .n small { display: block; color: var(--muted); font-weight: 700; }
.who .btn { padding: 8px 12px; font-size: .9rem; }
.devlist { display: flex; flex-direction: column; gap: 8px; }
.devcard { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: var(--deep); border-radius: 12px; padding: 10px; }
.devcard .pic { width: 44px; height: 56px; border-radius: 8px; background: linear-gradient(160deg, #6b3fa0, #432469); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.devcard b { font-family: var(--font-display); font-weight: 600; }
.devcard small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.3; }
.score-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score-table td, .score-table th { padding: 7px 4px; white-space: nowrap; text-align: right; border-bottom: 1px solid var(--line); font-size: .88rem; }
.score-table th { color: var(--muted); font-weight: 700; font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; }
.score-table td:first-child, .score-table th:first-child { text-align: left; }
.loglist { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; max-height: 46vh; overflow-y: auto; }
.loglist div { color: #cfe0e6; }
.loglist i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.costs { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; font-weight: 700; font-size: .9rem; }
.costs .pips { display: flex; gap: 3px; }
.costs .pips i { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { text-align: left; }
.confirm-row { display: flex; gap: 8px; }
.confirm-row .btn { flex: 1; }

/* curtain for pass and play */
.curtain { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(80% 60% at 50% 40%, var(--pc) 0%, #08141c 85%); text-align: center; }
.curtain h2 { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; margin: 0; text-shadow: 0 3px 12px rgba(0,0,0,.4); text-wrap: balance; }
.curtain p { margin: 0; color: #e3eef2; font-weight: 700; }

/* board svg classes */
.spot { cursor: pointer; }
.spot-v { animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.spot-e { animation: blink 1.1s ease-in-out infinite; }
.hl-hex { cursor: pointer; animation: blink 1.2s ease-in-out infinite; }
.flash { animation: flash 1.6s ease-out forwards; pointer-events: none; }
.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); transform-box: fill-box; transform-origin: center; }
.num { font-family: var(--font-display); font-weight: 600; }

@keyframes pulse { 0%,100% { transform: scale(.8); } 50% { transform: scale(1.12); } }
@keyframes blink { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); } 70% { transform: rotate(15deg) scale(1.1); } 100% { transform: none; } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
@keyframes bump { 30% { transform: translateY(-6px) scale(1.06); } }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }

/* wide screens: board left, panel right */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #game { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "board top" "board dock"; }
  .topbar { flex-direction: row; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; }
  .players { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: 1fr 1fr; }
  .dock { border-top: 0; border-left: 1px solid var(--line); justify-content: flex-start; padding: 12px; }
  .rcard { max-width: none; }
  .rcard .art { height: 40px; }
  .devbtn { max-width: none; }
}
</style>

<div id="app">
  <section id="home" class="screen"></section>
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <div class="players" id="players"></div>
      <button class="menu-btn" data-act="menu" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </header>
    <main class="board-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="static"></g><g id="dynamic"></g></svg>
      <div class="dice-box" id="dice"></div>
      <div class="ticker" id="ticker"></div>
      <div class="toasts" id="toasts"></div>
      <div class="zoom">
        <button data-act="zoom-in" aria-label="Zoom in">+</button>
        <button data-act="zoom-out" aria-label="Zoom out">−</button>
        <button data-act="zoom-fit" aria-label="Fit board"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
    </main>
    <footer class="dock" id="dock"></footer>
  </section>
  <div id="modal" hidden></div>
  <div id="curtain" class="curtain" hidden></div>
</div>

<script>
const Engine = (() => {
'use strict';
/* ===== Game engine: board generation, rules, state transitions ===== */
const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
const RES_NAME = { wood: 'Lumber', brick: 'Brick', sheep: 'Wool', wheat: 'Grain', ore: 'Ore', gold: 'Gold' };
const TERRAIN_NAME = { wood: 'Forest', brick: 'Hills', sheep: 'Pasture', wheat: 'Fields', ore: 'Mountains', gold: 'Gold field', desert: 'Desert', sea: 'Sea' };
const COST = {
  road: { wood: 1, brick: 1 },
  ship: { wood: 1, sheep: 1 },
  settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
  city: { wheat: 2, ore: 3 },
  dev: { sheep: 1, wheat: 1, ore: 1 },
};
const PIPS = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
const DEV_NAME = { knight: 'Knight', road: 'Road Building', plenty: 'Year of Plenty', mono: 'Monopoly', vp: 'Victory Point' };
const BASE_NUMS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
const SQ3 = Math.sqrt(3);
const AX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function emptyHand() { return { wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 }; }
function handCount(h) { return RES.reduce((s, r) => s + (h[r] || 0), 0); }
function hasCost(h, c) { return Object.keys(c).every(r => (h[r] || 0) >= c[r]); }
function isLandT(t) { return t !== 'sea'; }
function repeat(arr, n) { const out = []; for (let i = 0; out.length < n; i++) out.push(arr[i % arr.length]); return out; }

/* ---------- Board ---------- */
function buildBoard(defs) {
  const hexes = [], vertices = [], edges = [];
  const vmap = new Map(), emap = new Map(), hmap = new Map();
  defs.forEach((d, i) => {
    const x = SQ3 * (d.q + d.r / 2), y = 1.5 * d.r;
    const h = { id: i, q: d.q, r: d.r, x, y, terrain: d.terrain, number: null, island: null, home: false, v: [], e: [], n: [] };
    hexes.push(h); hmap.set(d.q + ',' + d.r, i);
    for (let k = 0; k < 6; k++) {
      const ang = Math.PI / 180 * (60 * k - 30);
      const vx = x + Math.cos(ang), vy = y + Math.sin(ang);
      const key = Math.round(vx * 1000) + ',' + Math.round(vy * 1000);
      let vid = vmap.get(key);
      if (vid === undefined) {
        vid = vertices.length; vmap.set(key, vid);
        vertices.push({ id: vid, x: vx, y: vy, hexes: [], adj: [], e: [], port: null, land: false });
      }
      vertices[vid].hexes.push(i); h.v.push(vid);
    }
  });
  hexes.forEach(h => {
    for (let k = 0; k < 6; k++) {
      const a = h.v[k], b = h.v[(k + 1) % 6];
      const key = a < b ? a + '-' + b : b + '-' + a;
      let eid = emap.get(key);
      if (eid === undefined) {
        eid = edges.length; emap.set(key, eid);
        edges.push({ id: eid, v: [Math.min(a, b), Math.max(a, b)], hexes: [] });
        vertices[a].adj.push(b); vertices[b].adj.push(a);
        vertices[a].e.push(eid); vertices[b].e.push(eid);
      }
      edges[eid].hexes.push(h.id); h.e.push(eid);
    }
    h.n = AX_DIRS.map(([dq, dr]) => hmap.get((h.q + dq) + ',' + (h.r + dr))).filter(x => x !== undefined);
  });
  vertices.forEach(v => { v.land = v.hexes.some(i => isLandT(hexes[i].terrain)); });
  edges.forEach(e => {
    const a = vertices[e.v[0]], b = vertices[e.v[1]];
    e.x = (a.x + b.x) / 2; e.y = (a.y + b.y) / 2;
    e.land = e.hexes.some(i => isLandT(hexes[i].terrain));
    e.sea = e.hexes.length === 2 && e.hexes.some(i => hexes[i].terrain === 'sea');
  });
  // islands by flood fill
  let isl = 0;
  hexes.forEach(h => {
    if (!isLandT(h.terrain) || h.island !== null) return;
    const stack = [h.id]; h.island = isl;
    while (stack.length) {
      const c = hexes[stack.pop()];
      c.n.forEach(j => { const o = hexes[j]; if (isLandT(o.terrain) && o.island === null) { o.island = isl; stack.push(j); } });
    }
    isl++;
  });
  return { hexes, vertices, edges, ports: [], islands: isl, home: 0 };
}

function numbersOk(board) {
  const red = n => n === 6 || n === 8;
  return board.hexes.every(h => {
    if (!h.number) return true;
    return h.n.every(j => {
      const o = board.hexes[j];
      if (!o.number) return true;
      if (red(h.number) && red(o.number)) return false;
      if (o.number === h.number) return false;
      return true;
    });
  });
}
function assignNumbers(board, pool) {
  const land = board.hexes.filter(h => isLandT(h.terrain) && h.terrain !== 'desert');
  for (let t = 0; t < 2000; t++) {
    const p = shuffle(pool.slice());
    land.forEach((h, i) => { h.number = p[i]; });
    if (numbersOk(board)) return;
  }
}

function placePorts(board, landPred, types) {
  const H = board.hexes;
  const cands = board.edges.filter(e => e.hexes.length === 2 &&
    e.hexes.some(i => landPred(H[i])) && e.hexes.some(i => H[i].terrain === 'sea'));
  const L = H.filter(landPred);
  const cx = L.reduce((s, h) => s + h.x, 0) / L.length, cy = L.reduce((s, h) => s + h.y, 0) / L.length;
  cands.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  const m = cands.length, n = types.length, off = Math.floor(Math.random() * m);
  const used = new Set(), chosen = [];
  for (let i = 0; i < n; i++) {
    const base = off + Math.round(i * m / n);
    for (const d of [0, 1, -1, 2, -2]) {
      const e = cands[((base + d) % m + m) % m];
      if (chosen.includes(e) || e.v.some(v => used.has(v) || board.vertices[v].adj.some(a => used.has(a)))) continue;
      chosen.push(e); e.v.forEach(v => used.add(v)); break;
    }
  }
  const ts = shuffle(types.slice());
  chosen.forEach((e, i) => {
    const sea = e.hexes.find(j => H[j].terrain === 'sea');
    board.ports.push({ edge: e.id, type: ts[i], hex: sea, v: e.v.slice() });
    e.v.forEach(v => { board.vertices[v].port = ts[i]; });
  });
}

function genBase() {
  const defs = [];
  for (let r = -3; r <= 3; r++) for (let q = -3; q <= 3; q++) {
    const d = Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
    if (d <= 3) defs.push({ q, r, terrain: d <= 2 ? 'land' : 'sea' });
  }
  const terr = shuffle([
    'wood', 'wood', 'wood', 'wood', 'sheep', 'sheep', 'sheep', 'sheep', 'wheat', 'wheat', 'wheat', 'wheat',
    'brick', 'brick', 'brick', 'ore', 'ore', 'ore', 'desert']);
  let k = 0; defs.forEach(d => { if (d.terrain === 'land') d.terrain = terr[k++]; });
  const b = buildBoard(defs);
  b.home = 0; b.hexes.forEach(h => { h.home = isLandT(h.terrain); });
  assignNumbers(b, BASE_NUMS);
  placePorts(b, h => isLandT(h.terrain), ['any', 'any', 'any', 'any', 'wood', 'brick', 'sheep', 'wheat', 'ore']);
  return b;
}

/* Archipelago: a home island plus small islands across the water ("new shores"). odd-r offset rows. */
const SEA_TEMPLATES = [
  [
    '.........',
    '..aa...b.',
    '..a...bb.',
    '.........',
    '..MMMM...',
    '.MMMMM.c.',
    '.MMMMM.c.',
    '..MMM..c.',
    '.........',
    '.dd...ee.',
    '.........',
  ],
  [
    '.........',
    '.aaa..bb.',
    '.......b.',
    '.c.......',
    '.c.MMMM..',
    '.c.MMMMM.',
    '...MMMMM.',
    '....MMM..',
    '.........',
    '..dd..ee.',
    '.........',
  ],
];
function genSeafarers() {
  const tpl = SEA_TEMPLATES[Math.floor(Math.random() * SEA_TEMPLATES.length)];
  const flip = Math.random() < 0.5;
  const defs = [];
  tpl.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      let q = c - (r - (r & 1)) / 2;
      if (flip) q = -q - r; // mirror left-right in axial coordinates
      defs.push({ q, r, terrain: ch === '.' ? 'sea' : (ch === 'M' ? 'main' : 'isle') });
    }
  });
  const main = defs.filter(d => d.terrain === 'main');
  const isle = defs.filter(d => d.terrain === 'isle');
  const mainT = shuffle(['desert'].concat(repeat(shuffle(RES.slice()).concat(shuffle(RES.slice())).concat(shuffle(RES.slice())).concat(shuffle(RES.slice())), main.length - 1)));
  main.forEach((d, i) => { d.terrain = mainT[i]; });
  const isleT = shuffle(['gold', 'gold'].concat(repeat(shuffle(['ore', 'wheat', 'sheep', 'wood', 'brick', 'ore', 'wheat', 'brick', 'wood', 'sheep']), isle.length - 2)));
  isle.forEach((d, i) => { d.terrain = isleT[i]; });
  const b = buildBoard(defs);
  // home island = the biggest one
  const sizes = Array(b.islands).fill(0);
  b.hexes.forEach(h => { if (h.island !== null) sizes[h.island]++; });
  b.home = sizes.indexOf(Math.max(...sizes));
  b.hexes.forEach(h => { h.home = h.island === b.home; });
  assignNumbers(b, BASE_NUMS.concat(shuffle([2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 3, 4, 5, 6, 8, 9, 10, 11])));
  placePorts(b, h => h.home, ['any', 'any', 'wood', 'brick', 'sheep', 'wheat', 'ore']);
  return b;
}

/* ---------- State ---------- */
function newGame(opts) {
  const mode = opts.mode === 'seafarers' ? 'seafarers' : 'base';
  const board = mode === 'seafarers' ? genSeafarers() : genBase();
  const n = opts.players.length;
  const players = opts.players.map((p, i) => ({
    id: i, name: p.name, color: p.color, bot: !!p.bot, hand: emptyHand(), dev: [], knights: 0,
    pieces: { road: 15, settlement: 5, city: 4, ship: mode === 'seafarers' ? 15 : 0 }, islands: [], bonusVP: 0,
  }));
  const desert = board.hexes.find(h => h.terrain === 'desert');
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  for (let i = n - 1; i >= 0; i--) order.push(i);
  const deck = shuffle([].concat(Array(14).fill('knight'), Array(5).fill('vp'), Array(2).fill('road'), Array(2).fill('plenty'), Array(2).fill('mono')));
  const s = {
    v: 1, mode, target: opts.target || (mode === 'seafarers' ? 13 : 10), friendly: !!opts.friendly, level: ['easy', 'normal', 'hard'].includes(opts.level) ? opts.level : 'normal',
    board, players,
    vb: Array(board.vertices.length).fill(null),
    eb: Array(board.edges.length).fill(null),
    robber: desert ? desert.id : null, pirate: null,
    bank: { wood: 19, brick: 19, sheep: 19, wheat: 19, ore: 19 },
    deck, current: 0, turnNo: 0,
    phase: 'setup', setup: { idx: 0, order, step: 'settlement', vertex: null },
    dice: null, log: [], fx: [],
    longest: { p: null, len: 0 }, army: { p: null, size: 0 },
    devPlayed: false, shipMoved: false, offerMade: 0, talk: { accepts: {}, declines: {} },
    discardQ: [], goldQ: [], after: null, stealFrom: [], freeRoads: 0, offer: null,
    winner: null, rollCounts: Array(13).fill(0),
  };
  log(s, 'New game. Place your first settlement and road.');
  return s;
}

function log(s, text, p) { s.log.push({ t: text, p: p === undefined ? null : p }); if (s.log.length > 250) s.log.shift(); }
function fx(s, e) { s.fx.push(e); }
function P(s, i) { return s.players[i]; }
function nm(s, i) { return s.players[i].name; }

function actor(s) {
  if (s.phase === 'discard') return s.discardQ[0].p;
  if (s.phase === 'gold') return s.goldQ[0].p;
  if (s.phase === 'offer') return s.offer.to;
  return s.current;
}

function publicVP(s, p) {
  let vp = 0;
  s.vb.forEach(b => { if (b && b.p === p) vp += b.t === 'city' ? 2 : 1; });
  if (s.longest.p === p) vp += 2;
  if (s.army.p === p) vp += 2;
  return vp + s.players[p].bonusVP;
}
function hiddenVP(s, p) { return s.players[p].dev.filter(d => d.type === 'vp').length; }
function totalVP(s, p) { return publicVP(s, p) + hiddenVP(s, p); }

function portsOf(s, p) {
  const set = new Set();
  s.vb.forEach((b, v) => { if (b && b.p === p && s.board.vertices[v].port) set.add(s.board.vertices[v].port); });
  return set;
}
function tradeRatio(s, p, r) {
  const ports = portsOf(s, p);
  if (ports.has(r)) return 2;
  if (ports.has('any')) return 3;
  return 4;
}

/* ---------- Placement rules ---------- */
function islandOfVertex(s, v) {
  for (const h of s.board.vertices[v].hexes) { const hx = s.board.hexes[h]; if (hx.island !== null) return hx.island; }
  return null;
}
function canSettle(s, p, v, setup) {
  const vx = s.board.vertices[v];
  if (!vx || !vx.land || s.vb[v]) return false;
  if (vx.adj.some(a => s.vb[a])) return false;
  if (setup) return vx.hexes.some(h => s.board.hexes[h].home);
  return vx.e.some(e => s.eb[e] && s.eb[e].p === p);
}
function connects(s, p, e, kind) {
  return s.board.edges[e].v.some(v => {
    const b = s.vb[v];
    if (b) return b.p === p;
    return s.board.vertices[v].e.some(x => x !== e && s.eb[x] && s.eb[x].p === p && s.eb[x].t === kind);
  });
}
function pirateAdj(s, e) { return s.pirate !== null && s.board.edges[e].hexes.includes(s.pirate); }
function canRoad(s, p, e, setupV) {
  const ed = s.board.edges[e];
  if (!ed || !ed.land || s.eb[e]) return false;
  if (setupV !== undefined && setupV !== null) return ed.v.includes(setupV);
  return connects(s, p, e, 'road');
}
function canShip(s, p, e, setupV) {
  if (s.mode !== 'seafarers') return false;
  const ed = s.board.edges[e];
  if (!ed || !ed.sea || s.eb[e] || pirateAdj(s, e)) return false;
  if (setupV !== undefined && setupV !== null) return ed.v.includes(setupV);
  return connects(s, p, e, 'ship');
}
function validSettlements(s, p, setup) { return s.board.vertices.filter(v => canSettle(s, p, v.id, setup)).map(v => v.id); }
function validCities(s, p) { return s.vb.map((b, v) => (b && b.p === p && b.t === 'settlement') ? v : -1).filter(v => v >= 0); }
function validRoads(s, p, setupV) { return s.board.edges.filter(e => canRoad(s, p, e.id, setupV)).map(e => e.id); }
function validShips(s, p, setupV) { return s.board.edges.filter(e => canShip(s, p, e.id, setupV)).map(e => e.id); }

function isOpenShip(s, p, e) {
  const o = s.eb[e];
  if (!o || o.p !== p || o.t !== 'ship') return false;
  return s.board.edges[e].v.some(v => {
    const b = s.vb[v];
    if (b && b.p === p) return false;
    return !s.board.vertices[v].e.some(x => x !== e && s.eb[x] && s.eb[x].p === p && s.eb[x].t === 'ship');
  });
}
function movableShips(s, p) {
  if (s.mode !== 'seafarers' || s.shipMoved || s.phase !== 'main' || s.current !== p) return [];
  return s.eb.map((o, e) => (o && o.p === p && o.t === 'ship' && o.turn !== s.turnNo && !pirateAdj(s, e) && isOpenShip(s, p, e)) ? e : -1).filter(e => e >= 0);
}
function shipTargets(s, p, from) {
  const saved = s.eb[from]; s.eb[from] = null;
  const out = validShips(s, p).filter(e => e !== from);
  s.eb[from] = saved;
  return out;
}

function robberTargets(s) {
  const out = [];
  s.board.hexes.forEach(h => {
    if (h.terrain === 'sea') { if (s.mode === 'seafarers' && h.id !== s.pirate) out.push(h.id); return; }
    if (h.id === s.robber) return;
    out.push(h.id);
  });
  if (!s.friendly) return out;
  const f = out.filter(id => {
    const h = s.board.hexes[id];
    if (h.terrain === 'sea') return true;
    return !h.v.some(v => s.vb[v] && s.vb[v].p !== s.current && publicVP(s, s.vb[v].p) <= 2);
  });
  return f.length ? f : out;
}
function victimsAt(s, hexId) {
  const h = s.board.hexes[hexId], set = new Set();
  if (h.terrain === 'sea') {
    h.e.forEach(e => { const o = s.eb[e]; if (o && o.t === 'ship' && o.p !== s.current) set.add(o.p); });
  } else {
    h.v.forEach(v => { const b = s.vb[v]; if (b && b.p !== s.current) set.add(b.p); });
  }
  return [...set].filter(p => handCount(s.players[p].hand) > 0 && !(s.friendly && publicVP(s, p) <= 2));
}

/* ---------- Longest road / largest army ---------- */
function roadLength(s, p) {
  const B = s.board;
  const mine = [];
  s.eb.forEach((o, e) => { if (o && o.p === p) mine.push(e); });
  if (!mine.length) return 0;
  const used = new Set();
  let best = 0;
  const ownB = v => s.vb[v] && s.vb[v].p === p;
  const blocked = v => s.vb[v] && s.vb[v].p !== p;
  function dfs(v, len, lastT, start) {
    if (len > best) best = len;
    if (!start && blocked(v)) return;
    for (const e of B.vertices[v].e) {
      const o = s.eb[e];
      if (!o || o.p !== p || used.has(e)) continue;
      if (lastT && o.t !== lastT && !ownB(v)) continue;
      used.add(e);
      const w = B.edges[e].v[0] === v ? B.edges[e].v[1] : B.edges[e].v[0];
      dfs(w, len + 1, o.t, false);
      used.delete(e);
    }
  }
  const starts = new Set();
  mine.forEach(e => B.edges[e].v.forEach(v => starts.add(v)));
  starts.forEach(v => dfs(v, 0, null, true));
  return best;
}
function updateLongest(s) {
  const lens = s.players.map(pl => roadLength(s, pl.id));
  const max = Math.max(...lens);
  const old = s.longest.p;
  let holder = old;
  if (max < 5) holder = null;
  else if (old !== null && lens[old] === max) holder = old;
  else {
    const top = lens.map((l, i) => l === max ? i : -1).filter(i => i >= 0);
    holder = top.length === 1 ? top[0] : null;
  }
  s.longest = { p: holder, len: holder === null ? max : lens[holder], lens };
  if (holder !== old) {
    if (holder !== null) { log(s, `${nm(s, holder)} takes Longest Road (${lens[holder]}).`, holder); fx(s, { type: 'award', what: 'Longest Road', p: holder }); }
    else if (old !== null) log(s, `${nm(s, old)} loses Longest Road.`, old);
  }
}
function updateArmy(s, p) {
  const k = s.players[p].knights;
  if (k >= 3 && (s.army.p === null ? true : (s.army.p !== p && k > s.army.size))) {
    s.army = { p, size: k };
    log(s, `${nm(s, p)} takes Largest Army (${k}).`, p); fx(s, { type: 'award', what: 'Largest Army', p });
  } else if (s.army.p === p) s.army.size = k;
}

function checkWin(s) {
  if (s.phase === 'setup' || s.phase === 'gameover') return;
  const p = s.current;
  if (totalVP(s, p) >= s.target) {
    s.phase = 'gameover'; s.winner = p;
    log(s, `${nm(s, p)} wins with ${totalVP(s, p)} points!`, p);
    fx(s, { type: 'win', p });
  }
}

/* ---------- Bank helpers ---------- */
function pay(s, p, cost) { const h = s.players[p].hand; for (const r in cost) { h[r] -= cost[r]; s.bank[r] += cost[r]; } }
function giveFromBank(s, p, r, n) { const k = Math.min(n, s.bank[r]); s.bank[r] -= k; s.players[p].hand[r] += k; return k; }

/* ---------- Placement ---------- */
function placeSettlement(s, p, v) {
  s.vb[v] = { p, t: 'settlement' };
  s.players[p].pieces.settlement--;
  if (s.mode === 'seafarers') {
    const isl = islandOfVertex(s, v);
    const pl = s.players[p];
    if (isl !== null && isl !== s.board.home && !pl.islands.includes(isl)) {

    const seen = new Map(); // key v|kind -> {dist, first}
    const q = [];
    const push = (v, kind, dist, first) => {
      const k = v + '|' + kind;
      if (seen.has(k)) return;
      seen.set(k, { dist, first }); q.push({ v, kind, dist, first });
    };
    // starting points
    s.vb.forEach((b, v) => { if (b && b.p === p) kinds.forEach(k => push(v, k, 0, null)); });
    s.eb.forEach((o, e) => {
      if (!o || o.p !== p) return;
      B.edges[e].v.forEach(v => { if (!s.vb[v] || s.vb[v].p === p) push(v, o.t, 0, null); });
    });
    let best = null;
    const prod = production(s, p);
    while (q.length) {
      const cur = q.shift();
      if (cur.dist > 0 && E.canSettle(s, p, cur.v, false) === false && !s.vb[cur.v] &&
        B.vertices[cur.v].land && !B.vertices[cur.v].adj.some(a => s.vb[a])) {
        // reachable but not yet connected: a candidate
        const val = vertexValue(s, p, cur.v, prod);
        const score = val / (0.8 + cur.dist * 0.55);
        if (!best || score > best.score) best = { target: cur.v, first: cur.first, dist: cur.dist, score, val };
      }
      if (cur.dist >= maxDist) continue;
      if (cur.dist > 0 && s.vb[cur.v] && s.vb[cur.v].p !== p) continue;
      for (const e of B.vertices[cur.v].e) {
        if (s.eb[e]) continue;
        const ed = B.edges[e];
        if (cur.kind === 'road' && !ed.land) continue;
        if (cur.kind === 'ship' && (!ed.sea || (s.pirate !== null && ed.hexes.includes(s.pirate)))) continue;
        if (cur.kind === 'road' && pl.pieces.road <= 0) continue;
        if (cur.kind === 'ship' && pl.pieces.ship <= 0) continue;
        const w = ed.v[0] === cur.v ? ed.v[1] : ed.v[0];
        push(w, cur.kind, cur.dist + 1, cur.first || { e, kind: cur.kind });
      }
    }
    return best;
  }

  function bestSettlement(s, p, setup) {
    const spots = E.validSettlements(s, p, setup);
    if (!spots.length) return null;
    const prod = production(s, p);
    let best = null, bv = -1e9;
    spots.forEach(v => { const val = vertexValue(s, p, v, prod) + Math.random() * lv(s).noise; if (val > bv) { bv = val; best = v; } });
    return best;
  }

  function goals(s, p) {
    const pl = s.players[p];
    const out = [];
    if (pl.pieces.city > 0 && E.validCities(s, p).length) out.push({ kind: 'city', w: lv(s).plan ? -0.6 : 0 });
    if (pl.pieces.settlement > 0 && E.validSettlements(s, p, false).length) out.push({ kind: 'settlement', w: 0 });
    else if (pl.pieces.settlement > 0) {
      const ex = expansion(s, p);
      if (ex) out.push({ kind: ex.first.kind, w: 0.5, ex });
    }
    if (s.deck.length) out.push({ kind: 'dev', w: lv(s).plan ? 1.7 : 1.2 });
    return out;
  }
  function missing(hand, cost) { return Object.keys(cost).reduce((a, r) => a + Math.max(0, cost[r] - hand[r]), 0); }
  function pickGoal(s, p) {
    const h = s.players[p].hand;
    const gs = goals(s, p);
    let best = null, bs = 1e9;
    gs.forEach(g => { const sc = missing(h, COST[g.kind]) + g.w; if (sc < bs) { bs = sc; best = g; } });
    return best;
  }
  function need(s, p, goal) {
    const h = s.players[p].hand, c = goal ? COST[goal.kind] : {};
    const out = {};
    RES.forEach(r => { out[r] = Math.max(0, (c[r] || 0) - h[r]); });
    return out;
  }

  // Value of a resource card to p right now
  function resValue(s, p, r, goal) {
    const h = s.players[p].hand;
    const c = goal ? COST[goal.kind] : {};
    let v = 1;
    if ((c[r] || 0) > h[r]) v += 1.2;
    if (h[r] === 0) v += 0.3;
    if (h[r] >= 4) v -= 0.4;
    const prod = production(s, p);
    v -= Math.min(0.5, (prod[r] || 0) / 20);
    return v;
  }

  function leader(s, exclude) {
    let best = null, bv = -1;
    s.players.forEach(pl => { if (pl.id === exclude) return; const v = E.publicVP(s, pl.id) + E.handCount(pl.hand) * 0.05; if (v > bv) { bv = v; best = pl.id; } });
    return best;
  }

  /* ---------- decisions ---------- */
  function setupStep(s, p) {
    if (s.setup.step === 'settlement') return E.doSetupSettlement(s, bestSettlement(s, p, true));
    const sv = s.setup.vertex;
    const opts = [];
    E.validRoads(s, p, sv).forEach(e => opts.push({ e, kind: 'road' }));
    if (s.mode === 'seafarers') E.validShips(s, p, sv).forEach(e => opts.push({ e, kind: 'ship' }));
    let best = opts[0], bv = -1e9;
    opts.forEach(o => {
      const ed = s.board.edges[o.e];
      const w = ed.v[0] === sv ? ed.v[1] : ed.v[0];
      let val = 0;
      s.board.vertices[w].adj.forEach(x => {
        if (x === sv || s.vb[x] || !s.board.vertices[x].land || s.board.vertices[x].adj.some(a => s.vb[a])) return;
        val = Math.max(val, vertexValue(s, p, x));
      });
      if (o.kind === 'ship') val *= 0.8;
      val += Math.random() * lv(s).noise;
      if (val > bv) { bv = val; best = o; }
    });
    return E.doSetupEdge(s, best.e, best.kind);
  }

  function discard(s, p) {
    const n = s.discardQ[0].n;
    const h = Object.assign({}, s.players[p].hand);
    const goal = pickGoal(s, p);
    const out = E.emptyHand();
    for (let i = 0; i < n; i++) {
      let best = null, bv = 1e9;
      RES.forEach(r => {
        if (h[r] - out[r] <= 0) return;
        const keep = goal ? (COST[goal.kind][r] || 0) : 0;
        const v = (h[r] - out[r] <= keep ? 3 : 0) - (h[r] - out[r]) * 0.3 + Math.random() * 0.1;
        if (v < bv) { bv = v; best = r; }
      });
      out[best]++;
    }
    return E.doDiscard(s, p, out);
  }

  function gold(s, p) {
    let n = Math.min(s.goldQ[0].n, RES.reduce((a, r) => a + s.bank[r], 0));
    const goal = pickGoal(s, p);
    const nd = need(s, p, goal);
    const picks = E.emptyHand();
    const prod = production(s, p);
    while (n > 0) {
      let r = RES.find(x => nd[x] > picks[x] && s.bank[x] > picks[x]);
      if (!r) r = RES.filter(x => s.bank[x] > picks[x]).sort((a, b) => (prod[a] - prod[b]) || (Math.random() - 0.5))[0];
      picks[r]++; n--;
    }
    return E.doGold(s, p, picks);
  }

  function robber(s, p) {
    const lead = leader(s, p);
    let best = null, bv = -1e9;
    E.robberTargets(s).forEach(id => {
      const h = s.board.hexes[id];
      let v = 0;
      if (h.terrain === 'sea') {
        h.e.forEach(e => { const o = s.eb[e]; if (o && o.t === 'ship') v += o.p === p ? -2 : 0.6; });
        v -= 0.5;
      } else {
        const pip = h.number ? PIPS[h.number] : 0;
        h.v.forEach(x => {
          const b = s.vb[x]; if (!b) return;
          const k = b.t === 'city' ? 2 : 1;
          if (b.p === p) v -= pip * k * 2.5;
          else v += pip * k * (b.p === lead ? lv(s).leaderW : 1) + (E.handCount(s.players[b.p].hand) > 0 ? 1 : 0);
        });
      }
      v += Math.random() * lv(s).robNoise;
      if (v > bv) { bv = v; best = id; }
    });
    return E.doMoveRobber(s, best);
  }
  function steal(s, p) {
    const c = s.stealFrom.slice().sort((a, b) => (E.publicVP(s, b) - E.publicVP(s, a)) || (E.handCount(s.players[b].hand) - E.handCount(s.players[a].hand)));
    return E.doSteal(s, c[0]);
  }

  function robberOnMe(s, p) {
    if (s.robber === null) return false;
    return s.board.hexes[s.robber].v.some(v => s.vb[v] && s.vb[v].p === p);
  }

  function tryDev(s, p, before) {
    if (s.devPlayed) return null;
    const pl = s.players[p];
    if (E.playableDev(s, p, 'knight')) {
      const armyChase = pl.knights + 1 >= 3 && s.army.p !== p && (s.army.p === null || pl.knights + 1 > s.army.size);
      if (robberOnMe(s, p) || armyChase || (!before && Math.random() < lv(s).knight)) return E.doPlayDev(s, 'knight');
    }
    if (before) return null;
    if (E.playableDev(s, p, 'mono')) {
      let best = null, bv = 0;
      RES.forEach(r => {
        const t = s.players.reduce((a, o) => {
          if (o.id === p) return a;
          const pr = production(s, o.id), tot = RES.reduce((x, k) => x + pr[k], 0) || 1;
          return a + E.handCount(o.hand) * pr[r] / tot;
        }, 0);
        if (t > bv) { bv = t; best = r; }
      });
      if (bv >= 3) return E.doPlayDev(s, 'mono', { res: best });
    }
    if (E.playableDev(s, p, 'plenty')) {
      const goal = pickGoal(s, p);
      if (goal) {
        const nd = need(s, p, goal);
        const tot = RES.reduce((a, r) => a + nd[r], 0);
        if (tot >= 1 && tot <= 2) {
          const picks = [];
          RES.forEach(r => { for (let i = 0; i < nd[r]; i++) picks.push(r); });
          while (picks.length < 2) picks.push(RES.slice().sort((a, b) => pl.hand[a] - pl.hand[b])[0]);
          if (picks.every(r => s.bank[r] >= picks.filter(x => x === r).length)) return E.doPlayDev(s, 'plenty', { res: picks });
        }
      }
    }
    if (E.playableDev(s, p, 'road') && pl.pieces.settlement > 0 && expansion(s, p)) return E.doPlayDev(s, 'road');
    return null;
  }

  function freeRoad(s, p) {
    const ex = expansion(s, p);
    if (ex && ex.first && E.buildSpots(s, p, ex.first.kind).includes(ex.first.e)) return E.doBuild(s, ex.first.kind, ex.first.e);
    const roads = E.validRoads(s, p);
    if (roads.length && s.players[p].pieces.road > 0) return E.doBuild(s, 'road', roads[Math.floor(Math.random() * roads.length)]);
    const ships = E.validShips(s, p);
    if (ships.length && s.players[p].pieces.ship > 0) return E.doBuild(s, 'ship', ships[Math.floor(Math.random() * ships.length)]);
    return E.doEndFreeRoads(s);
  }

  function bestCity(s, p) {
    const prod = production(s, p);
    let best = null, bv = -1;
    E.validCities(s, p).forEach(v => { const val = vertexValue(s, p, v, prod); if (val > bv) { bv = val; best = v; } });
    return best;
  }

  /* Would bot p accept: p receives `give`, pays `get`, from player `from`? Pure check, no side effects.
     Uses only public info about the other player (points), never their hand. */
  function judgeOffer(s, p, from, give, get) {
    const L = lv(s), me = s.players[p];
    if (!RES.every(r => (get[r] || 0) <= me.hand[r])) return { ok: false, why: 'no' };
    if (E.handCount(give) === 0 || E.handCount(get) === 0) return { ok: false, why: 'no' };
    if (E.publicVP(s, from) >= s.target - L.leaderGap) return { ok: false, why: 'leader' };
    const t = s.talk || { accepts: {}, declines: {} };
    if ((t.accepts[p] || 0) >= L.maxAccepts || (t.declines[p] || 0) >= L.maxDeclines) return { ok: false, why: 'done' };
    if (((s.turnNo * 37 + p * 11 + from * 5) % 100) / 100 < L.mood) return { ok: false, why: 'mood' };
    const goal = pickGoal(s, p);
    const c = goal ? COST[goal.kind] : {};
    const nd = need(s, p, goal);
    // must receive something it actually needs
    if (L.needHelp && !RES.some(r => (give[r] || 0) > 0 && nd[r] > 0)) return { ok: false, why: 'no' };
    // never gives away cards its current plan needs
    if (RES.some(r => (get[r] || 0) > 0 && me.hand[r] - get[r] < (c[r] || 0))) return { ok: false, why: 'no' };
    let gain = 0, loss = 0;
    RES.forEach(r => { gain += (give[r] || 0) * resValue(s, p, r, goal); loss += (get[r] || 0) * resValue(s, p, r, goal); });
    let margin = L.margin;
    // tougher with whoever is ahead of the bot
    if (E.publicVP(s, from) > E.publicVP(s, p)) margin += s.level === 'hard' ? 0.8 : 0.3;
    return { ok: gain > loss + margin, why: 'no' };
  }
  function considerOffer(s, p, from, give, get) { return judgeOffer(s, p, from, give, get).ok; }
  /* A real proposal: records the answer so bots tire of haggling. */
  function respond(s, p, from, give, get) {
    const j = judgeOffer(s, p, from, give, get);
    s.talk = s.talk || { accepts: {}, declines: {} };
    if (j.ok) s.talk.accepts[p] = (s.talk.accepts[p] || 0) + 1;
    else s.talk.declines[p] = (s.talk.declines[p] || 0) + 1;
    return j;
  }

  function mainStep(s, p) {
    const pl = s.players[p];
    s._botActions = (s._botActions || 0) + 1;
    if (s._botActions > 40) return E.doEndTurn(s);
    const d = tryDev(s, p, false); if (d) return d;
    // build what we can, best first
    if (E.canBuildKind(s, p, 'city')) return E.doBuild(s, 'city', bestCity(s, p));
    if (E.canBuildKind(s, p, 'settlement')) return E.doBuild(s, 'settlement', bestSettlement(s, p, false));
    const goal = pickGoal(s, p);
    const spotsOpen = E.validSettlements(s, p, false).length > 0;
    if (!spotsOpen && pl.pieces.settlement > 0) {
      const ex = expansion(s, p);
      if (ex && E.canAfford(s, p, ex.first.kind) && pl.pieces[ex.first.kind] > 0 && E.buildSpots(s, p, ex.first.kind).includes(ex.first.e)) {
        return E.doBuild(s, ex.first.kind, ex.first.e);
      }
    }
    if (goal && goal.kind === 'dev' && E.canAfford(s, p, 'dev') && s.deck.length) return E.doBuyDev(s);
    // bank trades toward the goal
    if (goal) {
      const c = COST[goal.kind];
      const nd = need(s, p, goal);
      const want = RES.filter(r => nd[r] > 0 && s.bank[r] > 0);
      if (want.length) {
        for (const r of RES) {
          const ratio = E.tradeRatio(s, p, r);
          const spare = pl.hand[r] - (c[r] || 0);
          if (spare >= ratio && !(lv(s).bankSkip && Math.random() < lv(s).bankSkip)) return E.doBankTrade(s, r, want[0]);
        }
        // propose a 1:1 to a human (once per turn)
        if (s.offerMade < 1) {
          const spare = RES.filter(r => pl.hand[r] - (c[r] || 0) >= 1).sort((a, b) => pl.hand[b] - pl.hand[a]);
          if (spare.length) {
            const humans = s.players.filter(o => !o.bot && o.id !== p && E.publicVP(s, o.id) < s.target - lv(s).leaderGap);
            if (humans.length) {
              const to = humans[Math.floor(Math.random() * humans.length)].id;
              const give = {}; give[spare[0]] = 1; const get = {}; get[want[0]] = 1;
              if (Math.random() < lv(s).offerRate) return E.doOffer(s, to, give, get);
              s.offerMade++;
            }
            // trade with another bot
            const g = {}; g[spare[0]] = 1; const w = {}; w[want[0]] = 1;
            s.offerMade++;
            const bots = s.players.filter(o => o.bot && o.id !== p);
            for (const o of bots) { if (respond(s, o.id, p, g, w).ok) return E.doTrade(s, o.id, g, w); }
          }
        }
      }
    }
    if (lv(s).plan) {
      // keep a road heading toward the next spot so settlements don't stall
      if (pl.pieces.settlement > 0 && E.validSettlements(s, p, false).length <= 1) {
        const ex = expansion(s, p);
        if (ex && ex.first && E.canAfford(s, p, ex.first.kind) && pl.pieces[ex.first.kind] > 0 && E.buildSpots(s, p, ex.first.kind).includes(ex.first.e)) {
          const h = pl.hand, c = COST[ex.first.kind];
          const spare = RES.every(r => h[r] - (c[r] || 0) >= 0) && (E.handCount(h) >= 6 || !E.validSettlements(s, p, false).length);
          if (spare) return E.doBuild(s, ex.first.kind, ex.first.e);
        }
      }
      // don't sit on more than 7 cards: dump surplus into the bank toward anything useful
      if (E.handCount(pl.hand) > 7) {
        const g2 = pickGoal(s, p), c2 = g2 ? COST[g2.kind] : {};
        const want2 = RES.filter(r => s.bank[r] > 0).sort((a, b) => ((c2[b] || 0) - pl.hand[b]) - ((c2[a] || 0) - pl.hand[a]));
        for (const r of RES) {
          const ratio = E.tradeRatio(s, p, r);
          if (pl.hand[r] - (c2[r] || 0) >= ratio && want2[0] && want2[0] !== r) return E.doBankTrade(s, r, want2[0]);
        }
      }
    }
    // Spend surplus on dev cards if rich
    if (E.handCount(pl.hand) >= 7 && E.canAfford(s, p, 'dev') && s.deck.length) return E.doBuyDev(s);
    if (E.handCount(pl.hand) >= 8 && spotsOpen === false) {
      const ex = expansion(s, p);
      if (ex && E.canAfford(s, p, ex.first.kind) && E.buildSpots(s, p, ex.first.kind).includes(ex.first.e)) return E.doBuild(s, ex.first.kind, ex.first.e);
    }
    s._botActions = 0;
    return E.doEndTurn(s);
  }

  function step(s) {
    const p = E.actor(s);
    switch (s.phase) {
      case 'setup': return setupStep(s, p);
      case 'discard': return discard(s, p);
      case 'gold': return gold(s, p);
      case 'robber': return robber(s, p);
      case 'steal': return steal(s, p);
      case 'roll': { const d = tryDev(s, p, true); if (d) return d; s._botActions = 0; return E.doRoll(s); }
      case 'main': return mainStep(s, p);
      case 'roadBuilding': return freeRoad(s, p);
      case 'offer': return E.doRespond(s, considerOffer(s, p, s.offer.from, s.offer.give, s.offer.get));
    }
    return { ok: false, err: 'idle' };
  }

  return { step, considerOffer, respond, vertexValue, expansion, production, LEVELS };
})();

function preset(kind) {
  const c = ui.cfg;

  const p2 = second ? second.name : 'Player 2';
  const bot = (i, col) => ({ name: BOT_NAMES[i], color: col, bot: true });
  if (kind === 'couple') c.players = [{ name: me.name, color: 'red', bot: false }, { name: p2, color: 'blue', bot: false }];
  if (kind === 'couple-bot') c.players = [{ name: me.name, color: 'red', bot: false }, { name: p2, color: 'blue', bot: false }, bot(0, 'orange')];
  if (kind === 'solo2') c.players = [{ name: me.name, color: 'red', bot: false }, bot(0, 'blue'), bot(1, 'orange')];
  if (kind === 'solo3') c.players = [{ name: me.name, color: 'red', bot: false }, bot(0, 'blue'), bot(1, 'orange'), bot(2, 'white')];
}

function hexPts(x, y, r) {
  return Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 180 * (60 * k - 30); return (x + r * Math.cos(a)).toFixed(3) + ',' + (y + r * Math.sin(a)).toFixed(3); }).join(' ');
}
const DECOR = [[0, -0.56], [-0.5, 0.33], [0.5, 0.33]];
function renderStatic() {
  const B = G.board;
  const land = B.hexes.filter(h => h.terrain !== 'sea');
  const xs = land.map(h => h.x), ys = land.map(h => h.y);
  const m = 1.75;
  ui.base = { x: Math.min(...xs) - m, y: Math.min(...ys) - m, w: Math.max(...xs) - Math.min(...xs) + 2 * m, h: Math.max(...ys) - Math.min(...ys) + 2 * m };
  ui.view = Object.assign({}, ui.base);
  applyView();
  let s = '';
  // sea
  B.hexes.forEach(h => {
    if (h.terrain !== 'sea') return;
    s += `<polygon points="${hexPts(h.x, h.y, 1)}" fill="${FILL.sea}" stroke="#3a8db5" stroke-width=".03"/>`;
    s += `<path d="M${(h.x - 0.32).toFixed(2)},${(h.y + 0.1).toFixed(2)} q.08,-.08 .16,0 t.16,0 t.16,0 t.16,0" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width=".035" stroke-linecap="round"/>`;
  });
  // beaches + land
  land.forEach(h => { s += `<polygon points="${hexPts(h.x, h.y, 1.02)}" fill="#e6d3a1"/>`; });
  land.forEach(h => {
    s += `<polygon points="${hexPts(h.x, h.y, 0.93)}" fill="${FILL[h.terrain]}" stroke="#00000022" stroke-width=".02"/>`;
    const g = GLYPH[h.terrain];
    if (g) DECOR.forEach(([dx, dy]) => { s += `<g transform="translate(${(h.x + dx).toFixed(3)},${(h.y + dy).toFixed(3)}) scale(.02)" opacity=".9">${g}</g>`; });
    if (h.number) {
      const red = h.number === 6 || h.number === 8;
      const pips = E.PIPS[h.number];
      s += `<circle cx="${h.x}" cy="${h.y}" r=".3" fill="#f7ecd0" stroke="#a88b54" stroke-width=".025"/>`;
      s += `<text class="num" x="${h.x}" y="${h.y + 0.07}" text-anchor="middle" font-size="${red ? 0.3 : 0.26}" fill="${red ? '#c0261b' : '#2b2116'}">${h.number}</text>`;
      for (let i = 0; i < pips; i++) s += `<circle cx="${(h.x + (i - (pips - 1) / 2) * 0.055).toFixed(3)}" cy="${h.y + 0.17}" r=".019" fill="${red ? '#c0261b' : '#2b2116'}"/>`;
    }
  });
  // ports
  B.ports.forEach(pt => {
    const sea = B.hexes[pt.hex], ed = B.edges[pt.edge];
    const bx = ed.x + (sea.x - ed.x) * 0.55, by = ed.y + (sea.y - ed.y) * 0.55;
    pt.v.forEach(v => {
      const vx = B.vertices[v];
      s += `<line x1="${bx}" y1="${by}" x2="${vx.x + (bx - vx.x) * 0.12}" y2="${vx.y + (by - vx.y) * 0.12}" stroke="#8b5e34" stroke-width=".07" stroke-linecap="round"/>`;
    });
    const any = pt.type === 'any';
    s += `<circle cx="${bx}" cy="${by}" r=".25" fill="#fbf6ea" stroke="${any ? '#6b5a40' : FILL[pt.type]}" stroke-width=".05"/>`;
    if (any) s += `<text class="num" x="${bx}" y="${by + 0.075}" text-anchor="middle" font-size=".2" fill="#2b2116">3:1</text>`;
    else s += `<g transform="translate(${bx},${by - 0.05}) scale(.012)">${GLYPH[pt.type]}</g><text class="num" x="${bx}" y="${by + 0.19}" text-anchor="middle" font-size=".12" fill="#2b2116">2:1</text>`;
  });
  $('#static').innerHTML = s;
}

function spotsFor(viewer) {
  // returns {v:[ids], e:[{id,kind}], h:[ids]} for the current human actor
  const out = { v: [], e: [], h: [] };
  if (!G || G.phase === 'gameover') return out;
  const a = E.actor(G);
  if (G.players[a].bot || needCurtain()) return out;
  if (G.phase === 'setup') {
    if (G.setup.step === 'settlement') out.v = E.validSettlements(G, a, true);
    else {
      const k = setupEdgeKind();
      (k === 'ship' ? E.validShips(G, a, G.setup.vertex) : E.validRoads(G, a, G.setup.vertex)).forEach(id => out.e.push({ id, kind: k }));
    }
  } else if (G.phase === 'robber') out.h = E.robberTargets(G);
  else if (G.phase === 'roadBuilding') {
    const k = freeEdgeKind();
    if (G.players[a].pieces[k] > 0) (k === 'ship' ? E.validShips(G, a) : E.validRoads(G, a)).forEach(id => out.e.push({ id, kind: k }));
  } else if (G.phase === 'main' && ui.mode) {
    const k = ui.mode.kind;
    if (k === 'settlement' || k === 'city') out.v = E.buildSpots(G, a, k);
    else if (k === 'road' || k === 'ship') E.buildSpots(G, a, k).forEach(id => out.e.push({ id, kind: k }));
    else if (k === 'moveFrom') E.movableShips(G, a).forEach(id => out.e.push({ id, kind: 'movefrom' }));
    else if (k === 'moveTo') E.shipTargets(G, a, ui.mode.from).forEach(id => out.e.push({ id, kind: 'moveto' }));
  }
  return out;
}
function setupEdgeKind() {
  if (G.mode !== 'seafarers') return 'road';
  const a = G.current, sv = G.setup.vertex;
  const r = E.validRoads(G, a, sv).length, sh = E.validShips(G, a, sv).length;
  if (ui.edgeKind === 'ship' && sh) return 'ship';
  if (!r && sh) return 'ship';
  return 'road';
}
function freeEdgeKind() {
  if (G.mode !== 'seafarers') return 'road';
  const pl = G.players[G.current];
  const r = pl.pieces.road > 0 && E.validRoads(G, G.current).length, sh = pl.pieces.ship > 0 && E.validShips(G, G.current).length;
  if (ui.edgeKind === 'ship' && sh) return 'ship';
  if (!r && sh) return 'ship';
  return 'road';
}

function renderDynamic() {
  const B = G.board;
  let s = '';

  });

  sp.e.forEach(({ id, kind }) => {
    const ed = B.edges[id], a = B.vertices[ed.v[0]], b = B.vertices[ed.v[1]];

    s += `<g class="spot" data-e="${id}" data-k="${kind}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width=".38"/><g class="spot-e"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#10222c" stroke-opacity=".55" stroke-width=".2" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width=".11" stroke-linecap="round" stroke-dasharray="${kind === 'ship' || kind === 'moveto' ? '.09 .06' : 'none'}"/></g>${kind === 'movefrom' ? `<circle cx="${ed.x}" cy="${ed.y}" r=".22" fill="none" stroke="#ffc94a" stroke-width=".04"/>` : ''}</g>`;

  });
  if (ui.pending) s += ghostSvg();

}
function ghostSvg() {
  const B = G.board, p = ui.pending, col = pcol(E.actor(G)), kind = pendingKind();
  let g = '';
  if (p.h !== null) {
    const h = B.hexes[p.h];

    g += kind === 'pirate'

  } else if (p.v !== null) {
    const vx = B.vertices[p.v];
    const d = kind === 'city' ? cityPath(vx.x, vx.y) : settlementPath(vx.x, vx.y, 1.15);
    g += `<circle cx="${vx.x}" cy="${vx.y}" r=".3" fill="none" stroke="#ffc94a" stroke-width=".05"/><path d="${d}" fill="${col}" fill-opacity=".75" stroke="#ffc94a" stroke-width=".04" stroke-linejoin="round"/>`;
  } else if (p.e !== null) {
    const ed = B.edges[p.e], a = B.vertices[ed.v[0]], b = B.vertices[ed.v[1]], sh = 0.16;
    const x1 = a.x + (b.x - a.x) * sh, y1 = a.y + (b.y - a.y) * sh, x2 = b.x - (b.x - a.x) * sh, y2 = b.y - (b.y - a.y) * sh;
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffc94a" stroke-width=".22" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-opacity=".85" stroke-width=".12" stroke-linecap="round"/>`;
    if (kind === 'ship') g += shipSvg(ed.x, ed.y + 0.06, col, '');

}

/* ---------- view (pan / zoom) ---------- */
function applyView() { const v = ui.view; $('#board').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`); }
function clampView() {
  const b = ui.base, v = ui.view;
  v.w = Math.min(b.w, Math.max(b.w / 3.5, v.w)); v.h = v.w * b.h / b.w;
  v.x = Math.min(b.x + b.w - v.w, Math.max(b.x, v.x));
  v.y = Math.min(b.y + b.h - v.h, Math.max(b.y, v.y));
}
function zoomAt(f, ux, uy) {
  const v = ui.view;
  if (ux === undefined) { ux = v.x + v.w / 2; uy = v.y + v.h / 2; }
  const nw = v.w * f, nh = v.h * f;
  v.x = ux - (ux - v.x) * f; v.y = uy - (uy - v.y) * f; v.w = nw; v.h = nh;
  clampView(); applyView();
}
function unitsPerPx() { const r = $('#board').getBoundingClientRect(); return Math.max(ui.view.w / r.width, ui.view.h / r.height); }
function toUnits(px, py, view) {
  const r = $('#board').getBoundingClientRect();
  const k = Math.max(view.w / r.width, view.h / r.height);
  const offX = (r.width - view.w / k) / 2, offY = (r.height - view.h / k) / 2;
  return { x: view.x + (px - r.left - offX) * k, y: view.y + (py - r.top - offY) * k, k };
}
const pz = { pts: new Map(), start: null, startView: null, moved: false, justDragged: false };
function setupPanZoom() {
  const svg = $('#board');
  svg.addEventListener('pointerdown', ev => {
    pz.pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    pz.start = new Map([...pz.pts].map(([k, p]) => [k, Object.assign({}, p)]));
    pz.startView = Object.assign({}, ui.view);
    if (pz.pts.size === 1) pz.moved = false;
  });
  window.addEventListener('pointermove', ev => {
    if (!pz.pts.has(ev.pointerId)) return;
    pz.pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    const ids = [...pz.pts.keys()];
    if (ids.length === 1) {
      const p0 = pz.start.get(ids[0]); if (!p0) return;
      const dx = ev.clientX - p0.x, dy = ev.clientY - p0.y;
      if (!pz.moved && Math.hypot(dx, dy) < 8) return;
      if (ui.view.w >= ui.base.w - 1e-6) return; // nothing to pan when fully zoomed out
      pz.moved = true;
      const k = toUnits(0, 0, pz.startView).k;
      ui.view.x = pz.startView.x - dx * k; ui.view.y = pz.startView.y - dy * k;
      clampView(); applyView();
    } else if (ids.length >= 2) {
      const a0 = pz.start.get(ids[0]), b0 = pz.start.get(ids[1]);
      if (!a0 || !b0) return;
      const a1 = pz.pts.get(ids[0]), b1 = pz.pts.get(ids[1]);
      const d0 = Math.hypot(a0.x - b0.x, a0.y - b0.y), d1 = Math.hypot(a1.x - b1.x, a1.y - b1.y);
      if (d0 < 10 || d1 < 10) return;
      pz.moved = true;
      const f = d0 / d1;
      const sv = pz.startView;
      const m0 = toUnits((a0.x + b0.x) / 2, (a0.y + b0.y) / 2, sv);
      const nv = { w: sv.w * f, h: sv.h * f };
      const r = $('#board').getBoundingClientRect();
      const k1 = m0.k * f;
      const offX = (r.width - nv.w / k1) / 2, offY = (r.height - nv.h / k1) / 2;
      nv.x = m0.x - ((a1.x + b1.x) / 2 - r.left - offX) * k1;
      nv.y = m0.y - ((a1.y + b1.y) / 2 - r.top - offY) * k1;
      ui.view = nv; clampView(); applyView();
    }
  });
  const up = ev => {
    if (!pz.pts.has(ev.pointerId)) return;
    pz.pts.delete(ev.pointerId);
    if (pz.pts.size === 0) { if (pz.moved) pz.justDragged = true; setTimeout(() => { pz.justDragged = false; }, 60); }
    else { pz.start = new Map([...pz.pts].map(([k, p]) => [k, Object.assign({}, p)])); pz.startView = Object.assign({}, ui.view); }
  };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const u = toUnits(ev.clientX, ev.clientY, ui.view);
    zoomAt(ev.deltaY > 0 ? 1.12 : 1 / 1.12, u.x, u.y);
  }, { passive: false });
  svg.addEventListener('click', ev => {
    if (pz.justDragged) { pz.justDragged = false; return; }
    const t = ev.target.closest('[data-v],[data-e],[data-h]');
    if (t) onBoardTap(t);
  });
}

/* ================= RENDER ================= */
function needCurtain() {
  if (!G || G.phase === 'gameover' || G.phase === 'setup') return false;
  const a = E.actor(G);
  return !G.players[a].bot && privacyOn() && ui.revealed !== a;
}
function viewer() {
  if (!G) return null;
  const a = E.actor(G);
  if (!G.players[a].bot && !needCurtain()) return a;
  const h = humans();
  if (h.length === 1) return h[0].id;
  if (privacyOn()) return null; // pass and play: keep hands hidden while others act
  if (ui.revealed !== null && !G.players[ui.revealed].bot) return ui.revealed;
  return h[0] ? h[0].id : null;
}

function render() {
  if (!G) return;
  const a = E.actor(G);
  if (!G.players[a].bot && (G.phase === 'setup' || !privacyOn())) ui.revealed = a;
  renderPlayers();
  renderDynamic();
  renderDice();
  renderTicker();
  renderDock();
  renderCurtain();
  renderPhaseModal();
}

function renderPlayers() {
  const cur = G.phase === 'gameover' ? G.winner : G.current;
  const me = viewer();
  $('#players').innerHTML = G.players.map(p => {
    const pub = E.publicVP(G, p.id);
    const showHidden = G.phase === 'gameover' || p.id === me;
    const hid = E.hiddenVP(G, p.id);
    const badges = [];
    if (G.longest.p === p.id) badges.push('<span class="badge">ROAD</span>');
    if (G.army.p === p.id) badges.push('<span class="badge">ARMY</span>');
    const gain = ui.gains[p.id] ? `<span class="gain">+${ui.gains[p.id]}</span>` : '';
    return `<div class="pchip ${p.id === cur ? 'turn' : ''}" style="--pc:${colorHex(p.color)}">
      <div class="badges">${badges.join('')}</div>
      <div class="nm"><i></i><span>${esc(p.name)}</span></div>
      <div class="vp">${pub + (showHidden ? hid : 0)}<small>${showHidden && hid ? `incl. ${hid} hidden` : `/ ${G.target}`}</small></div>
      <div class="meta"><span title="Resource cards">${ICON.card}${E.handCount(p.hand)}</span><span title="Development cards" style="color:#c6a8f0">${ICON.card}${p.dev.length}</span>${p.knights ? `<span title="Knights played">${ICON.sword}${p.knights}</span>` : ''}${((G.longest.lens || [])[p.id] || 0) >= 3 ? `<span title="Longest road">${ICON.roadsm}${G.longest.lens[p.id]}</span>` : ''}</div>
      ${gain}
    </div>`;
  }).join('');
}

function dieHtml(n, red) {
  const L = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] }[n];
  let s = '';
  for (let i = 1; i <= 9; i++) s += L.includes(i) ? `<b style="grid-area:${Math.ceil(i / 3)}/${(i - 1) % 3 + 1}"></b>` : '';
  return `<div class="die ${red ? 'red-die' : ''}">${s}</div>`;
}
function renderDice() {
  const d = G.dice;
  // redraw only when a new roll happened, so the spin plays once per roll
  const key = d ? d.join(',') + ':' + G.turnNo + ':' + G.rollCounts.reduce((x, y) => x + y, 0) : '';
  if (ui.diceKey === key) return;
  ui.diceKey = key;
  $('#dice').innerHTML = d ? dieHtml(d[0], false) + dieHtml(d[1], true) + `<span class="dice-sum">${d[0] + d[1]}</span>` : '';
}
function renderTicker() {
  const last = G.log.slice(-2);
  $('#ticker').innerHTML = last.map(l => `<div>${l.p !== null ? `<i style="background:${pcol(l.p)}"></i>` : ''}${esc(l.t)}</div>`).join('');
}

function costDots(kind) {
  const c = E.COST[kind]; let s = '';
  Object.keys(c).forEach(r => { for (let i = 0; i < c[r]; i++) s += `<i style="background:${RES_DOT[r]}"></i>`; });
  return `<span class="cost">${s}</span>`;
}

function handHtml(p, opts) {
  const pl = G.players[p];
  const bump = ui.bump || {};
  const cards = E.RES.map(r => `<div class="rcard ${pl.hand[r] ? '' : 'zero'} ${bump[r] ? 'bump' : ''}" title="${E.RES_NAME[r]}"><div class="art" style="background:${FILL[r]}">${glyphSvg(r, 26)}</div><div class="ct">${pl.hand[r]}</div></div>`).join('');
  const playable = ['knight', 'road', 'plenty', 'mono'].some(t => E.playableDev(G, p, t));
  const dev = `<button class="devbtn ${playable ? 'glow' : ''}" data-act="dev" ${opts && opts.noDev ? 'disabled' : ''}><b>${pl.dev.length}</b>Cards</button>`;
  return `<div class="hand">${cards}${dev}</div>`;
}

function renderDock() {
  const a = E.actor(G);
  const pa = G.players[a];
  const v = viewer();
  let prompt = '', body = '';
  const col = colorHex(pa.color);
  if (G.phase === 'gameover') {
    prompt = `${esc(G.players[G.winner].name)} wins!`;
    body = (v !== null ? handHtml(v, { noDev: true }) : '') + `<div class="row2"><button class="btn primary" data-act="show-results">See results</button><button class="btn" data-act="home">New game</button></div>`;
    $('#dock').innerHTML = `<div class="prompt" style="--pc:${pcol(G.winner)}"><i></i><span>${prompt}</span></div>${body}`;
    return;
  }
  if (pa.bot || needCurtain()) {
    const what = pa.bot ? `<span class="thinking">${esc(pa.name)} is playing</span>` : `<span>Waiting for ${esc(pa.name)}</span>`;
    $('#dock').innerHTML = `<div class="prompt" style="--pc:${col}"><i></i>${what}</div>${v !== null ? handHtml(v, { noDev: true }) : ''}`;
    return;
  }

  if (ui.pending) {
    const what = { settlement: 'Build a settlement here?', city: 'Upgrade to a city here?', road: 'Build a road here?', ship: ui.mode && ui.mode.kind === 'moveTo' ? 'Sail the ship here?' : 'Place a ship here?', robber: 'Move the robber here?', pirate: 'Move the pirate here?' }[pendingKind()];
    $('#dock').innerHTML = `<div class="prompt" style="--pc:${col}"><i></i><span>${what} <small style="color:var(--muted);font-weight:700">Tap another spot to change it.</small></span></div>${handHtml(me, { noDev: true })}<div class="row2"><button class="btn" data-act="pending-no">Cancel</button><button class="btn primary big" data-act="pending-yes">Confirm</button></div>`;

  }
  if (G.phase === 'setup') {
    const first = G.setup.idx < G.players.length;
    if (G.setup.step === 'settlement') prompt = `${esc(pl.name)}: place your ${first ? 'first' : 'second'} settlement`;
    else prompt = `${esc(pl.name)}: place a ${setupEdgeKind()} next to it`;

    let extra = '';
    if (G.setup.step === 'road' && G.mode === 'seafarers' && E.validShips(G, me, G.setup.vertex).length && E.validRoads(G, me, G.setup.vertex).length) {
      extra = `<div class="row2"><div class="seg" role="group" style="flex:1"><button style="flex:1" aria-pressed="${setupEdgeKind() === 'road'}" data-act="edge-kind" data-k="road">Road</button><button style="flex:1" aria-pressed="${setupEdgeKind() === 'ship'}" data-act="edge-kind" data-k="ship">Ship</button></div></div>`;
    }
    body = handHtml(me, { noDev: true }) + extra;
  } else if (G.phase === 'roll') {
    prompt = `${esc(pl.name)}, your turn`;
    const knight = E.playableDev(G, me, 'knight');
    body = handHtml(me) + `<div class="row2">${knight ? '<button class="btn" data-act="play-knight" data-confirm="Play knight?">Play knight</button>' : ''}<button class="btn primary big" data-act="roll">Roll dice</button></div>`;
  } else if (G.phase === 'robber') {
    prompt = G.mode === 'seafarers' ? 'Move the robber (land) or the pirate (sea): tap a tile' : 'Move the robber: tap a tile';
    body = handHtml(me, { noDev: true });
  } else if (G.phase === 'roadBuilding') {
    const k = freeEdgeKind();
    prompt = `Free ${k} ${3 - G.freeRoads} of 2: tap a spot`;
    const both = G.mode === 'seafarers' && pl.pieces.ship > 0 && E.validShips(G, me).length && pl.pieces.road > 0 && E.validRoads(G, me).length;
    body = handHtml(me, { noDev: true }) + `<div class="row2">${both ? `<div class="seg" role="group" style="flex:1"><button style="flex:1" aria-pressed="${k === 'road'}" data-act="edge-kind" data-k="road">Road</button><button style="flex:1" aria-pressed="${k === 'ship'}" data-act="edge-kind" data-k="ship">Ship</button></div>` : ''}<button class="btn narrow" data-act="end-free" data-confirm="Skip?">Skip</button></div>`;
  } else if (G.phase === 'main') {
    if (ui.mode) {
      const k = ui.mode.kind;
      prompt = { road: 'Tap a glowing edge to build a road', ship: 'Tap a glowing edge to launch a ship', settlement: 'Tap a glowing corner to settle', city: 'Tap a settlement to upgrade it', moveFrom: 'Pick a ship to move (only open-ended ships can sail)', moveTo: 'Pick where the ship sails to' }[k];
    } else prompt = `${esc(pl.name)}: build, trade, or end your turn`;
    const kinds = ['road', 'settlement', 'city', G.mode === 'seafarers' ? 'ship' : null].filter(Boolean);

      return `<button class="act ${on ? 'on' : ''}" data-act="build" data-k="${k}" ${can || on ? '' : 'disabled'} style="--ic:${col}"><span class="ic">${ICON[k]}</span><span class="lb">${label}</span>${costDots(k)}</button>`;
