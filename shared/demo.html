<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HubKit demo</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --bg:#eef1f5; --card:#fff; --text:#1b2230; --muted:#5d6675; --line:rgba(20,30,50,.15); }
  @media (prefers-color-scheme: dark) { :root { --bg:#121722; --card:#1a2030; --text:#eef1f6; --muted:#a3adbd; --line:rgba(255,255,255,.15); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { margin:0; font-size:20px; }
  main { max-width:760px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  h2 { margin:0 0 10px; font-size:13px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  button.t, label.t { min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
  button.t:hover { background:rgba(128,128,128,.15); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  pre { margin:0; padding:10px; border-radius:10px; background:rgba(128,128,128,.14); font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
  #page { height:40px; }
</style>
</head>
<body>
<header id="hdr"><h1>HubKit demo</h1></header>
<main>
  <section>
    <h2>Menu</h2>
    <div class="row">
      <button class="t" id="openBtn" type="button">HubKit.open()</button>
      <button class="t" id="floatBtn" type="button">Toggle floating button</button>
    </div>
  </section>
  <section>
    <h2>Sounds</h2>
    <label class="t row" style="margin-bottom:10px"><input type="checkbox" id="quiet"> Play at volume 0.6 (bot style)</label>
    <div class="grid" id="sounds"></div>
  </section>
  <section>
    <h2>HubKit.settings (live)</h2>
    <pre id="state">...</pre>
  </section>
  <section>
    <h2>Event log</h2>
    <pre id="log">(nothing yet)</pre>
    <p style="margin:8px 0 0;color:var(--muted);font-size:14px">Last key seen by this page: <b id="lastKey">none</b> (stays unchanged while the sheet is open). Press <b>m</b> to mute.</p>
  </section>
</main>

<script src="../shared/hubkit.js"></script>
<script>window.HubKit=window.HubKit||{init(){},buttonHTML:()=>'',open(){},close(){},isOpen:()=>false,sfx(){},buzz(){},refresh(){},setFloating(){},settings:{}};</script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var logLines = [];
  function log(m) { logLines.unshift(m); logLines = logLines.slice(0, 6); $('#log').textContent = logLines.join('\n'); }

  var paces = ['Slow', 'Normal', 'Fast'], pace = 1, hide = true;
  HubKit.init({
    id: 'demo',
    name: 'Demo Game',
    accent: { light: '#b07d12', dark: '#f2b632' },
    scheme: 'auto',
    floating: false,
    items: function () {
      return [
        { label: 'Rules', onSelect: function () { log('Rules selected'); } },
        { label: 'New game', confirm: 'Tap again to end this game', onSelect: function () { log('New game confirmed'); } },
        { label: 'Bot speed', value: paces[pace], onSelect: function () { pace = (pace + 1) % 3; log('Bot speed: ' + paces[pace]); } },
        { label: 'Hide hands', toggle: true, checked: hide, onSelect: function (on) { hide = on; log('Hide hands: ' + on); } }
      ];
    },
    onOpen: function () { log('onOpen'); },
    onClose: function () { log('onClose'); },
    onLeave: function () { log('onLeave'); }
  });

  $('#hdr').insertAdjacentHTML('beforeend', HubKit.buttonHTML());

  var names = ['tap','place','flip','draw','score','chime','error','win','end','dice','build','clink','coin','thud','swish','tick','buzzer'];
  $('#sounds').innerHTML = names.map(function (n) { return '<button class="t" type="button" data-sfx="' + n + '">' + n + '</button>'; }).join('');
  $('#sounds').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sfx]');
    if (b) HubKit.sfx(b.getAttribute('data-sfx'), $('#quiet').checked ? { volume: 0.6 } : undefined);
  });

  var floating = false;
  $('#openBtn').addEventListener('click', function () { HubKit.open(); });
  $('#floatBtn').addEventListener('click', function () { floating = !floating; HubKit.setFloating(floating); });

  document.addEventListener('keydown', function (e) { $('#lastKey').textContent = e.key; });

  function showState() { $('#state').textContent = JSON.stringify(HubKit.settings, null, 2) + '\nisOpen: ' + HubKit.isOpen(); }
  showState();
  setInterval(showState, 250);
})();
</script>
</body>
</html>
